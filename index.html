<!-- טעינת ספריות Firebase CDN (גרסת SDK v8 המקבלת את firebase גלובלי) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  // השוואה עמוקה שלא רגישה לסדר מפתחות - Firebase לא תמיד שומר על סדר המפתחות המקורי
  function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    const keysA = Object.keys(a);
    const keysB = Object.keys(b);
    if (keysA.length !== keysB.length) return false;
    for (const key of keysA) {
      if (!deepEqual(a[key], b[key])) return false;
    }
    return true;
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBPGqqiNBEAb1x082bfPUR8mzsks71wKcU",
    authDomain: "academic-tasks-4b84c.firebaseapp.com",
    databaseURL: "https://academic-tasks-4b84c-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "academic-tasks-4b84c",
    storageBucket: "academic-tasks-4b84c.firebasestorage.app",
    messagingSenderId: "790453742502",
    appId: "1:790453742502:web:266c824d72762fc6cf7d67",
    measurementId: "G-8NZ9PLWYKT"
  };

  let database = null;
  let historyData = {};
  let historyLoadError = null;
  let pendingLocalWrites = 0; // כמה כתיבות מקומיות ל-Firebase עדיין "באוויר" ולא התאמתו (למניעת דריסה ע"י הד ישן)

  // אתחול Firebase - עטוף ב-try/catch כדי שאם הטעינה נכשלת (למשל אין אינטרנט) הדף לא יישבר
  try {
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    // סנכרון בזמן אמת מול Firebase עם השלמת רשימות ריקות
    let pendingRemoteBoardData = null;
    let pendingRemoteBoardRetryTimer = null;
    function hasOpenInteractiveMenu(){
      // pendingLocalWrites>0 = יש כתיבה מקומית שעדיין לא הושלמה/התאמתה מול השרת (למשל הוספת תת-סעיף
      // שזה עתה קרתה) - מחכים שהיא תתאמת לפני שמקבלים עדכון מרוחק, כדי לא לדרוס אותה בטעות בהד ישן
      return !!(openQuestionMenu || openMarkPopup || openAddCommentPopup || openRowAddPopup || pendingLocalWrites > 0);
    }
    function applyRemoteBoardData(data){
      // אם יש כרגע תפריט/פופאפ פתוח (למשל לחיצה על "תת-סעיף" או על צבע סימון),
      // דוחים את החלת העדכון המרוחק בכמה עשרות אלפיות שנייה כדי לא "לשטוף" את הכפתור מתחתיה
      if(hasOpenInteractiveMenu()){
        pendingRemoteBoardData = data;
        if(!pendingRemoteBoardRetryTimer){
          pendingRemoteBoardRetryTimer = setTimeout(() => {
            pendingRemoteBoardRetryTimer = null;
            const d = pendingRemoteBoardData;
            pendingRemoteBoardData = null;
            if(d) applyRemoteBoardData(d);
          }, 400);
        }
        return;
      }
      if (deepEqual(data, state)) return;
      state = data;
      render();
    }
    database.ref('boardState').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && Array.isArray(data.categories)) {
        // Firebase מוחק מערכים ריקים, אז אנחנו משלימים אותם כאן כדי שהקוד לא יישבר
        data.categories.forEach(cat => {
          if (!cat.questions) cat.questions = [];
          if (['cat1', 'cat2', 'cat3', 'cat-general'].includes(cat.id)) cat.permanent = true;
          cat.questions.forEach(q => {
            if (!q.comments) q.comments = [];
            if (!q.commentMarks) q.commentMarks = [];
            if (!q.commentNights) q.commentNights = [];
            if (!q.commentNightsOn) q.commentNightsOn = [];
            if (!q.commentExtra) q.commentExtra = [];
            q.comments.forEach((c, i) => {
              if (!q.commentExtra[i]) q.commentExtra[i] = [];
              q.commentExtra[i].forEach(item => {
                if (!item.text) item.text = '';
              });
            });
          });
        });
        // Firebase מחזיר אלינו הד של הכתיבה שלנו עצמנו - אם הנתונים זהים למה שכבר יש,
        // מדובר בהד ולא בשינוי אמיתי ממישהו אחר, אז מדלגים על render() כדי לא לאפס פוקוס
        applyRemoteBoardData(data);
      } else if (!data) {
        // מסד הנתונים ריק לגמרי (פעם ראשונה) - נשמור את ברירת המחדל כדי שכל המכשירים יתחילו מאותה נקודה
        saveStateToFirebase();
      } else {
        console.error('Ignoring malformed data from Firebase:', data);
      }
    }, (err) => {
      console.error('Firebase read failed (check your database Rules):', err);
    });

    // סנכרון בזמן אמת מול היסטוריית השאלות שנמחקו (לפי תאריך מחיקה)
    database.ref('historyState').on('value', (snapshot) => {
      historyData = snapshot.val() || {};
      historyLoadError = null;
      if (typeof currentView !== 'undefined' && currentView === 'history') render();
    }, (err) => {
      console.error('Firebase history read failed (check your database Rules):', err);
      historyLoadError = (err && err.message) ? err.message : 'שגיאה לא ידועה';
      if (typeof currentView !== 'undefined' && currentView === 'history') render();
    });
  } catch (err) {
    console.error('Firebase init failed:', err);
  }

  // פונקציה לשמירה בכל שינוי
  function saveStateToFirebase() {
    if (!database) return;
    pendingLocalWrites++;
    database.ref('boardState').set(state)
      .catch((err) => {
        console.error('Firebase SAVE failed (check your database Rules for write access):', err);
      })
      .finally(() => {
        setTimeout(() => {
          if (pendingLocalWrites > 0) pendingLocalWrites--;
        }, 500);
      });
  }

  // מחזיר מפתח תאריך בפורמט YYYY-MM-DD (לפי שעון מקומי) לשימוש בהיסטוריית משמרות
  function getTodayDateKey() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return yyyy + '-' + mm + '-' + dd;
  }

  // מארכב שאלה שנמחקה להיסטוריית המשמרות, לפי תאריך היום וקטגוריה.
  function archiveDeletedQuestion(cat, q, explicitDateKey, isAutoRollover) {
    if (!database) return;
    if (isAutoRollover) {
      q.autoArchived = true;
    }
    q.deletedAt = nowHM();
    const dateKey = explicitDateKey || getTodayDateKey();
    const catRef = database.ref('historyState/' + dateKey + '/' + cat.id);
    catRef.child('title').set(cat.title);
    catRef.child('questions').push(q).catch((err) => {
      console.error('Firebase ARCHIVE failed:', err);
    });
  }
</script>

  .mark-tools .mark-dot-clear{

<script>
function renderTodayDate(){
  const days = ['יום ראשון', 'יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי', 'יום שבת'];
  const now = new Date();
  const dayName = days[now.getDay()];
  const dd = String(now.getDate()).padStart(2, '0');
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const yy = String(now.getFullYear()).slice(-2);
  const dateStr = dd + '/' + mm + '/' + yy;
  const el = document.getElementById('todayDate');
  if(el) el.innerText = dayName + ' ' + dateStr;
}
renderTodayDate();

let state = {
  categories: [
    {
      id: 'cat1',
      title: 'כללי 1',
      questions: [],
      permanent: true
    },
    {
      id: 'cat2',
      title: 'כללי 2',
      questions: [],
      permanent: true
    },
    {
      id: 'cat3',
      title: 'כללי 3',
      questions: [],
      permanent: true
    },
    {
      id: 'cat-general',
      title: 'כללי 4',
      questions: [],
      permanent: true
    }
  ]
};

let currentView = 'board';
let lastFocusCatId = null;
let lastFocusNewQid = null;
let recentlyCreatedQid = null;
let recentlyCreatedQidTimer = null;
function protectRecentlyCreatedQid(qId){
  recentlyCreatedQid = qId;
  if(recentlyCreatedQidTimer) clearTimeout(recentlyCreatedQidTimer);
  recentlyCreatedQidTimer = setTimeout(() => {
    recentlyCreatedQid = null;
    recentlyCreatedQidTimer = null;
  }, 2000);
}
let lastFocusCommentQid = null;
let lastFocusCommentIdx = null;
let lastFocusNightQid = null;
let lastFocusNightIdx = null;
let navOrder = [];
let flatNav = [];
let questionNav = [];

function isCaretOnFirstLine(el){
  const sel = window.getSelection();
  if(!sel.rangeCount) return true;
  const range = sel.getRangeAt(0).cloneRange();
  range.collapse(true);
  let rects = range.getClientRects();
  if(rects.length === 0) rects = [el.getBoundingClientRect()];
  const caretRect = rects[0];
  const elRect = el.getBoundingClientRect();
  return (caretRect.top - elRect.top) < (caretRect.height / 2 + 2);
}
function isCaretOnLastLine(el){
  const sel = window.getSelection();
  if(!sel.rangeCount) return true;
  const range = sel.getRangeAt(0).cloneRange();
  range.collapse(true);
  let rects = range.getClientRects();
  if(rects.length === 0) rects = [el.getBoundingClientRect()];
  const caretRect = rects[0];
  const elRect = el.getBoundingClientRect();
  return (elRect.bottom - caretRect.bottom) < (caretRect.height / 2 + 2);
}
function normalizeEmptyOnBlur(el){
  if(el.textContent.trim() === '' && !el.querySelector('img') && el.innerHTML !== ''){
    el.innerHTML = '';
  }
}

function getCaretOffset(el){
  const sel = window.getSelection();
  if(sel.rangeCount === 0) return 0;
  const range = sel.getRangeAt(0);
  if(!el.contains(range.startContainer)) return 0;
  const preRange = document.createRange();
  preRange.selectNodeContents(el);
  preRange.setEnd(range.startContainer, range.startOffset);
  return preRange.toString().length;
}
function placeCaretAtEnd(el){
  if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}
function placeCaretAtStart(el){
  if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}
function findQuestionByQid(qid){
  for(const cat of state.categories){
    const q = cat.questions.find(q => q.id === qid);
    if(q) return q;
  }
  return null;
}
function extrasFor(qid, idx){
  const q = findQuestionByQid(qid);
  return (q && q.commentExtra && q.commentExtra[idx]) || [];
}
function focusExtra(qid, idx, subIdx, atStart){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="extra"][data-idx="${idx}"][data-subidx="${subIdx}"]`);
  if(!el) return false;
  el.focus();
  if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
  return true;
}
function focusForwardFromRowEnd(qid, idx){
  const pos = flatIndexOf(qid, idx);
  if(pos !== -1 && pos + 1 < flatNav.length){
    return focusFlatItemForward(flatNav[pos + 1], true);
  }
  return false;
}
function focusFieldEnd(qid, col){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="${col}"]`);
  if(!el) return;
  el.focus();
  placeCaretAtEnd(el);
}
function focusFieldStart(qid, col){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="${col}"]`);
  if(!el) return;
  el.focus();
  placeCaretAtStart(el);
}
function queryFlatEl(item, columnType){
  if(item.idx === null || item.idx === undefined){
    const col = columnType === 'primary' ? 'text' : 'answer';
    return document.querySelector(`[data-qid="${item.qid}"][data-col="${col}"]`);
  }
  const col = columnType === 'primary' ? 'comment' : 'commentNight';
  return document.querySelector(`[data-qid="${item.qid}"][data-col="${col}"][data-idx="${item.idx}"]`);
}
function focusFlatItemAt(item, columnType, atStart){
  if(!item) return false;
  if(item.qid === null){
    const el = document.getElementById('add-input-' + item.catId);
    if(!el) return false;
    el.focus();
    if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
    return true;
  }
  let el = queryFlatEl(item, columnType);
  if(!el && columnType === 'secondary'){
    el = queryFlatEl(item, 'primary');
  }
  if(!el) return false;
  el.focus();
  if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
  return true;
}
function focusFlatItemForward(item, atStart){
  if(!item) return false;
  if(item.qid === null){
    return focusFlatItemAt(item, 'primary', atStart);
  }
  let el = queryFlatEl(item, 'primary');
  if(!el) el = queryFlatEl(item, 'secondary');
  if(!el) return false;
  el.focus();
  if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
  return true;
}
function focusFlatItem(item, columnType){
  return focusFlatItemAt(item, columnType, false);
}
function flatIndexOf(qid, idx){
  const normIdx = (idx === undefined) ? null : idx;
  return flatNav.findIndex(item => item.qid === qid && item.idx === normIdx);
}
function moveQuestionVertical(qid, columnType, dir){
  const pos = questionNav.findIndex(item => item.qid === qid);
  if(pos === -1) return false;
  const newPos = pos + dir;
  if(newPos < 0 || newPos >= questionNav.length) return false;
  const targetQid = questionNav[newPos].qid;
  let el = queryFlatEl({qid: targetQid, idx: null}, columnType);
  if(!el && columnType === 'secondary'){
    el = queryFlatEl({qid: targetQid, idx: null}, 'primary');
  }
  if(!el) return false;
  el.focus();
  placeCaretAtEnd(el);
  return true;
}
function goForwardFromField(qid, normIdx, columnType){
  if(columnType === 'primary'){
    if(normIdx === null){
      const pos = flatIndexOf(qid, normIdx);
      if(pos !== -1 && pos + 1 < flatNav.length){
        return focusFlatItemForward(flatNav[pos + 1], true);
      }
      return false;
    }
    const nightEl = document.querySelector(`[data-qid="${qid}"][data-col="commentNight"][data-idx="${normIdx}"]`);
    if(nightEl){
      nightEl.focus();
      placeCaretAtStart(nightEl);
      return true;
    }
    const extras = extrasFor(qid, normIdx);
    return extras.length > 0 ? focusExtra(qid, normIdx, 0, true) : focusForwardFromRowEnd(qid, normIdx);
  } else {
    if(normIdx !== null){
      const extras = extrasFor(qid, normIdx);
      return extras.length > 0 ? focusExtra(qid, normIdx, 0, true) : focusForwardFromRowEnd(qid, normIdx);
    }
    const pos = flatIndexOf(qid, normIdx);
    if(pos !== -1 && pos + 1 < flatNav.length){
      return focusFlatItemForward(flatNav[pos + 1], true);
    }
    return false;
  }
}
function goBackwardFromField(qid, normIdx, columnType){
  if(columnType === 'secondary'){
    const el = queryFlatEl({qid, idx: normIdx}, 'primary');
    if(el){
      el.focus();
      placeCaretAtEnd(el);
      return true;
    }
  }
  const pos = flatIndexOf(qid, normIdx);
  if(pos > 0){
    return focusFlatItemAt(flatNav[pos - 1], 'secondary', false);
  }
  return false;
}
function handleFieldNav(e, qid, idx, columnType){
  const el = e.currentTarget;
  const normIdx = (idx === undefined) ? null : idx;
  if(e.key === 'ArrowUp'){
    if(isCaretOnFirstLine(el)){
      e.preventDefault();
      if(normIdx === null){
        moveQuestionVertical(qid, columnType, -1);
      } else {
        goBackwardFromField(qid, normIdx, columnType);
      }
    }
  } else if(e.key === 'ArrowDown'){
    if(isCaretOnLastLine(el)){
      e.preventDefault();
      if(normIdx === null){
        moveQuestionVertical(qid, columnType, 1);
      } else {
        goForwardFromField(qid, normIdx, columnType);
      }
    }
  } else if(e.key === 'ArrowLeft'){
    if(getCaretOffset(el) === el.textContent.length){
      const moved = goForwardFromField(qid, normIdx, columnType);
      if(moved) e.preventDefault();
    }
  } else if(e.key === 'ArrowRight'){
    if(getCaretOffset(el) === 0){
      const moved = goBackwardFromField(qid, normIdx, columnType);
      if(moved) e.preventDefault();
    }
  }
}

function focusExtraOrFallback(qid, idx, subIdx, atStart){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="extra"][data-idx="${idx}"][data-subidx="${subIdx}"]`);
  if(el){
    el.focus();
    if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
    return true;
  }
  return false;
}
function handleExtraNav(e, qid, idx, subIdx, extraCount){
  const el = e.currentTarget;
  const goBackward = () => {
    if(subIdx > 0) return focusExtraOrFallback(qid, idx, subIdx - 1, false);
    const nightEl = document.querySelector(`[data-qid="${qid}"][data-col="commentNight"][data-idx="${idx}"]`);
    if(nightEl){ nightEl.focus(); placeCaretAtEnd(nightEl); return true; }
    const commentEl = document.querySelector(`[data-qid="${qid}"][data-col="comment"][data-idx="${idx}"]`);
    if(commentEl){ commentEl.focus(); placeCaretAtEnd(commentEl); return true; }
    return false;
  };
  const goForward = () => {
    if(subIdx < extraCount - 1) return focusExtraOrFallback(qid, idx, subIdx + 1, true);
    return focusForwardFromRowEnd(qid, idx);
  };
  if(e.key === 'ArrowUp'){
    if(isCaretOnFirstLine(el)){
      e.preventDefault();
      goBackward();
    }
  } else if(e.key === 'ArrowDown'){
    if(isCaretOnLastLine(el)){
      e.preventDefault();
      goForward();
    }
  } else if(e.key === 'ArrowLeft'){
    if(getCaretOffset(el) === el.textContent.length){
      e.preventDefault();
      goForward();
    }
  } else if(e.key === 'ArrowRight'){
    if(getCaretOffset(el) === 0){
      e.preventDefault();
      goBackward();
    }
  }
}

function focusPrevCategoryEnd(idx){
  if(idx < 0) return;
  const cat = state.categories[idx];
  if(cat.questions.length > 0){
    focusFieldEnd(cat.questions[cat.questions.length - 1].id, 'text');
  } else {
    focusPrevCategoryEnd(idx - 1);
  }
}

function handleAddInputNav(e, catId){
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const catIndex = state.categories.findIndex(c => c.id === catId);
  if(e.key === 'ArrowUp'){
    const cat = state.categories[catIndex];
    if(cat.questions.length > 0){
      focusFieldEnd(cat.questions[cat.questions.length - 1].id, 'text');
    } else {
      focusPrevCategoryEnd(catIndex - 1);
    }
  } else {
    if(catIndex < state.categories.length - 1){
      const nextCat = state.categories[catIndex + 1];
      if(nextCat.questions.length > 0){
        focusFieldEnd(nextCat.questions[0].id, 'text');
      } else {
        const nextInput = document.getElementById('add-input-' + nextCat.id);
        if(nextInput) nextInput.focus();
      }
    }
  }
}

function insertLineBreakAtCaret(){
  document.execCommand('insertLineBreak', false, null);
}

function attachImagePaste(el, onChange){
  el.addEventListener('paste', (e) => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    let imageItem = null;
    for(let i = 0; i < items.length; i++){
      if(items[i].type && items[i].type.indexOf('image/') === 0){
        imageItem = items[i];
        break;
      }
    }
    e.preventDefault();
    if(imageItem){
      const file = imageItem.getAsFile();
      const reader = new FileReader();
      reader.onload = () => {
        document.execCommand('insertImage', false, reader.result);
        const imgs = el.querySelectorAll('img[src="' + reader.result + '"]');
        const newImg = imgs[imgs.length - 1];
        if(newImg && !newImg.style.width){
          newImg.onload = () => {
            const naturalW = newImg.naturalWidth || 320;
            newImg.style.width = Math.min(naturalW, 320) + 'px';
          };
          if(newImg.complete && newImg.naturalWidth){
            newImg.style.width = Math.min(newImg.naturalWidth, 320) + 'px';
          }
        }
        if(onChange) onChange();
      };
      reader.readAsDataURL(file);
    } else {
      const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
      document.execCommand('insertText', false, text);
      if(onChange) onChange();
    }
  });
}

function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9);
}

function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function persistImageChange(img){
  const editable = img.closest('[contenteditable="true"]');
  if(editable) editable.dispatchEvent(new Event('input', { bubbles: true }));
}

function buildImageSizeRow(labelText, img, styleProp, minPx, maxPx, defaultPx){
  const row = document.createElement('div');
  row.className = 'image-resize-row';

  const label = document.createElement('span');
  label.innerText = labelText;
  row.appendChild(label);

  const currentVal = parseInt(img.style[styleProp]) || defaultPx;

  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = String(minPx);
  slider.max = String(maxPx);
  slider.value = String(currentVal);

  const valLabel = document.createElement('span');
  valLabel.className = 'image-resize-percent';
  valLabel.innerText = currentVal + 'px';

  slider.oninput = () => {
    img.style[styleProp] = slider.value + 'px';
    if(styleProp === 'width') img.style.maxWidth = 'none';
    if(styleProp === 'height') img.style.maxHeight = 'none';
    valLabel.innerText = slider.value + 'px';
  };
  slider.onchange = () => persistImageChange(img);

  row.appendChild(slider);
  row.appendChild(valLabel);
  return row;
}

function openImageResizePopup(img){
  closeImageResizePopup();
  activeResizeImg = img;

  const popup = document.createElement('div');
  popup.className = 'image-resize-popup';
  popup.id = 'imageResizePopup';

  const naturalW = img.naturalWidth || 200;
  const naturalH = img.naturalHeight || 150;
  const defaultW = Math.round(img.getBoundingClientRect().width) || naturalW || 200;
  const defaultH = Math.round(img.getBoundingClientRect().height) || naturalH || 150;

  popup.appendChild(buildImageSizeRow('רוחב:', img, 'width', 30, 1200, defaultW));
  popup.appendChild(buildImageSizeRow('גובה:', img, 'height', 30, 1000, defaultH));

  document.body.appendChild(popup);

  const rect = img.getBoundingClientRect();
  let top = rect.top - popup.offsetHeight - 8;
  if(top < 4) top = rect.bottom + 8;
  let left = rect.left;
  const maxLeft = window.innerWidth - popup.offsetWidth - 8;
  if(left > maxLeft) left = Math.max(4, maxLeft);
  if(left < 4) left = 4;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

function closeImageResizePopup(){
  const popup = document.getElementById('imageResizePopup');
  if(popup){
    if(activeResizeImg) persistImageChange(activeResizeImg);
    popup.remove();
  }
  activeResizeImg = null;
}

function appendAttr(el, by, at){
  if(!by && !at) return;
  const span = document.createElement('span');
  span.className = 'q-attr-inline';
  span.innerText = ' (' + (by || '?') + (at ? ' ' + at : '') + ')';
  el.appendChild(span);

let dragCtx = null;

function startQuestionDrag(e, handle, qDiv, catId){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const catDiv = qDiv.parentElement;
  if(!catDiv) return;
  dragCtx = { catId: catId, qDiv: qDiv, catDiv: catDiv, pointerId: e.pointerId };
  qDiv.classList.add('qdrag-dragging');
  try { handle.setPointerCapture(e.pointerId); } catch(err){}
  handle.onpointermove = (ev) => onQuestionDragMove(ev);
  handle.onpointerup = (ev) => endQuestionDrag(ev, handle);
  handle.onpointercancel = (ev) => endQuestionDrag(ev, handle);
}

function onQuestionDragMove(e){
  if(!dragCtx) return;
  const catDiv = dragCtx.catDiv;
  const qDiv = dragCtx.qDiv;
  const y = e.clientY;
  const siblings = Array.from(catDiv.children).filter(el => el.classList.contains('question-block') && el !== qDiv);
  let target = null;
  for(let i = 0; i < siblings.length; i++){
    const rect = siblings[i].getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if(y < mid){ target = siblings[i]; break; }
  }
  if(target){
    if(target !== qDiv.nextSibling){
      catDiv.insertBefore(qDiv, target);
    }
  } else {
    const addRow = catDiv.querySelector('.add-row');
    if(addRow){
      if(addRow.previousSibling !== qDiv) catDiv.insertBefore(qDiv, addRow);
    } else if(catDiv.lastElementChild !== qDiv){
      catDiv.appendChild(qDiv);
    }
  }
}

function endQuestionDrag(e, handle){
  if(!dragCtx) return;
  const catDiv = dragCtx.catDiv;
  const catId = dragCtx.catId;
  const qDiv = dragCtx.qDiv;
  qDiv.classList.remove('qdrag-dragging');
  try { handle.releasePointerCapture(e.pointerId); } catch(err){}
  handle.onpointermove = null;
  handle.onpointerup = null;
  handle.onpointercancel = null;
  dragCtx = null;

  const cat = state.categories.find(c => c.id === catId);
  if(cat){
    const orderedIds = Array.from(catDiv.children)
      .filter(el => el.classList.contains('question-block'))
      .map(el => el.dataset.qid);
    const byId = {};
    cat.questions.forEach(q => { byId[q.id] = q; });
    const newQuestions = orderedIds.map(id => byId[id]).filter(Boolean);
    if(newQuestions.length === cat.questions.length){
      cat.questions = newQuestions;
    }
  }
  render();
  saveStateToFirebase();
}

      const bodyDiv = document.createElement('div');

      textDiv.dataset.col = 'text';

      textDiv.oninput = () => updateText(cat.id, q.id, 'text', textDiv.innerHTML);
      textDiv.onkeydown = (e) => handleFieldNav(e, q.id, null, 'primary');
      textDiv.onblur = () => {
        normalizeEmptyOnBlur(textDiv);
        updateText(cat.id, q.id, 'text', textDiv.innerHTML);
        deleteQuestionIfEmpty(cat.id, q.id);

      attachImagePaste(textDiv, () => updateText(cat.id, q.id, 'text', textDiv.innerHTML));

          commentDiv.onkeydown = (e) => handleFieldNav(e, q.id, idx, 'primary');

            const empty = commentDiv.textContent.trim() === '' && !commentDiv.querySelector('img');

              commentHandledDelete = true;
              deleteComment(cat.id, q.id, idx);
            } else if(empty && rowHasMore){
              commentHandledDelete = true;
              q.comments[idx] = '';
              saveStateToFirebase();
              render();
            } else {
              updateComment(cat.id, q.id, idx, commentDiv.innerText);
            }
          };
          bodyDiv.appendChild(commentDiv);

          if(q.id === lastFocusCommentQid && idx === lastFocusCommentIdx){
            const focusQid = q.id, focusIdx = idx;
            requestAnimationFrame(() => {
              commentDiv.focus();
              placeCaretAtEnd(commentDiv);
            });
            lastFocusCommentQid = null;
            lastFocusCommentIdx = null;
          }
        }

        const nightOn = rowHasNight;
        if(nightOn){
          const nightValue = (q.commentNights && q.commentNights[idx]) || '';
          const nightField = buildDateThreadField({
            value: nightValue,
            dataset: { qid: q.id, col: 'commentNight', idx: idx },
            onCommit: (val) => {
              if(val.trim() === ''){

              } else {
                updateCommentNight(cat.id, q.id, idx, val);
              }
            }
          });

          if(q.id === lastFocusNightQid && idx === lastFocusNightIdx){
            const focusQid = q.id, focusIdx = idx;
            requestAnimationFrame(() => {
              nightField.input.focus();
            });
            lastFocusNightQid = null;
            lastFocusNightIdx = null;
          }
        }

        extraItems.forEach((item, subIdx) => {
          if(item.type === 'night'){
            const extraField = buildDateThreadField({
              value: item.text || '',
              dataset: { qid: q.id, col: 'extra', idx: idx, subidx: subIdx },

                if(val.trim() === ''){
                  deleteCommentExtra(cat.id, q.id, idx, subIdx);

                  updateCommentExtra(cat.id, q.id, idx, subIdx, val);

          itemDiv.spellcheck = true;
          itemDiv.lang = 'he';
          itemDiv.setAttribute('data-placeholder', 'הערה...');
          itemDiv.setAttribute('data-qid', q.id);
          itemDiv.setAttribute('data-col', 'extra');
          itemDiv.setAttribute('data-idx', idx);
          itemDiv.setAttribute('data-subidx', subIdx);
          itemDiv.innerText = item.text || '';
          itemDiv.onkeydown = (e) => handleExtraNav(e, q.id, idx, subIdx, extraItems.length);
          let extraHandledDelete = false;
          itemDiv.oninput = () => {
            if(extraHandledDelete) return;
            if(itemDiv.textContent.trim() === '' && !itemDiv.querySelector('img')){

              deleteCommentExtra(cat.id, q.id, idx, subIdx);
            } else {
              updateCommentExtra(cat.id, q.id, idx, subIdx, itemDiv.innerText);

          itemDiv.onblur = () => {
            if(extraHandledDelete) return;
            normalizeEmptyOnBlur(itemDiv);
            if(itemDiv.textContent.trim() === '' && !itemDiv.querySelector('img')){
              extraHandledDelete = true;
              deleteCommentExtra(cat.id, q.id, idx, subIdx);
            } else {
              updateCommentExtra(cat.id, q.id, idx, subIdx, itemDiv.innerText);
            }
          };
          bodyDiv.appendChild(itemDiv);
        });

        const isLastRow = idx === (q.comments.length - 1);
        if(isLastRow){
          const rowKey = rowAddPopupKey(q.id, idx);
          const isRowPopupOpen = openRowAddPopup === rowKey;
          const rowAddWrap = document.createElement('span');

          rowAddWrap.style.alignItems = 'center';
          rowAddWrap.style.position = 'relative';

          const rowAddBtn = document.createElement('button');

          rowAddBtn.innerText = '+';
          rowAddBtn.title = 'הוסף הערה או מועד';

        bodyDiv.appendChild(addCommentWrap);

      const doneBtn = document.createElement('button');

      qDiv.appendChild(bodyDiv);

      if(pendingDeleteQid === q.id){
        const confirmWrap = document.createElement('span');

    flatNav.push({qid: null, idx: 'add', catId: cat.id});

    const addRow = document.createElement('div');

    const addBtn = document.createElement('button');
    addBtn.innerText = '+';
    addBtn.title = 'הוסף משימה';
    addBtn.onclick = () => addQuestion(cat.id, addInput.innerHTML);

    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);

    board.appendChild(catDiv);

  const addCatBottom = document.createElement('div');
  addCatBottom.className = 'add-category-row';
  addCatBottom.style.marginTop = '10px';

  const bottomInput = document.createElement('input');
  bottomInput.type = 'text';

  bottomInput.placeholder = 'שם קטגוריה חדשה, למשל: כללי 5';

    if(e.key === 'Enter'){

      addCategory('new-cat-input-bottom');
    }
  };
  addCatBottom.appendChild(bottomInput);

  const bottomBtn = document.createElement('button');
  bottomBtn.innerText = '+';
  bottomBtn.title = 'הוסף קטגוריה חדשה';
  bottomBtn.onclick = () => addCategory('new-cat-input-bottom');
  addCatBottom.appendChild(bottomBtn);

  board.appendChild(addCatBottom);

  if(lastFocusCatId){
    const catIdToFocus = lastFocusCatId;
    const inputToFocus = document.getElementById('add-input-' + catIdToFocus);
    if(inputToFocus) inputToFocus.focus();
    lastFocusCatId = null;
  }
}

function formatDateKeyDisplay(dateKey){
  const parts = dateKey.split('-');
  if(parts.length !== 3) return dateKey;
  const days = ['יום ראשון', 'יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי', 'יום שבת'];
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  return days[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
}

function formatDateShort(dateStr){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr || '')) return dateStr || '';
  const parts = dateStr.split('-');
  return parts[2] + '/' + parts[1];
}

function buildDateThreadField(opts){
  const wrap = document.createElement('span');
  wrap.className = 'answer-date-wrap2';

  const input = document.createElement('input');
  input.type = 'date';
  input.className = 'answer-date-input';
  Object.keys(opts.dataset).forEach(k => { input.dataset[k] = opts.dataset[k]; });
  input.value = opts.value || '';

  const label = document.createElement('button');
  label.type = 'button';
  label.className = 'answer-date-label2';
  label.innerText = opts.value ? formatDateShort(opts.value) : '';
  label.title = opts.value ? ('התאריך המלא שנשמר: ' + formatDateKeyDisplay(opts.value)) : '';

  function showInput(){
    label.style.display = 'none';
    input.style.display = '';
    input.focus();
    if(typeof input.showPicker === 'function'){
      try { input.showPicker(); } catch(err){}
    }
  }
  function showLabel(){
    input.style.display = 'none';
    label.style.display = '';
  }

  label.onclick = showInput;

  input.onchange = () => {
    opts.onCommit(input.value);
    if(input.value){
      label.innerText = formatDateShort(input.value);
      label.title = 'התאריך המלא שנשמר: ' + formatDateKeyDisplay(input.value);
      showLabel();
    }
  };
  input.onblur = () => {
    if(input.value){
      showLabel();
    }
  };

  if(opts.value){
    input.style.display = 'none';
  } else {
    label.style.display = 'none';
  }

  wrap.appendChild(input);
  wrap.appendChild(label);
  return { wrap: wrap, input: input, label: label };
}

function toggleHistoryView(){
  currentView = (currentView === 'history') ? 'board' : 'history';
  render();
}

function buildReadOnlyQuestionBlock(q, isNightCat, numberLabel, restoreInfo, dateKey){
  const qDiv = document.createElement('div');
  qDiv.className = 'question-block readonly' + (q.sub ? ' sub' : '');

  const numDiv = document.createElement('div');
  numDiv.className = 'qnum';
  numDiv.innerText = numberLabel;
  qDiv.appendChild(numDiv);

  const bodyDiv = document.createElement('div');
  bodyDiv.className = 'qbody';

  const textDiv = document.createElement('div');
  textDiv.className = isNightCat ? 'answer' : ('qtext' + (q.textMark ? (' mark-' + q.textMark) : ''));
  textDiv.innerHTML = q.text || '';
  bodyDiv.appendChild(textDiv);

  (q.comments || []).forEach((commentText, idx) => {
    const mark = (q.commentMarks && q.commentMarks[idx]) || null;
    if(commentText && commentText.trim() !== ''){
      const commentDiv = document.createElement('div');
      commentDiv.className = 'comment' + (mark ? (' mark-' + mark) : '');
      commentDiv.innerText = commentText;
      bodyDiv.appendChild(commentDiv);
    }
    const nightText = q.commentNights && q.commentNights[idx];
    if(nightText && nightText.trim() !== ''){
      const nightDiv = document.createElement('div');
      nightDiv.className = 'answer';
      nightDiv.innerText = formatDateShort(nightText);
      bodyDiv.appendChild(nightDiv);
    }
    const extraItems = (q.commentExtra && q.commentExtra[idx]) || [];
    extraItems.forEach(item => {
      if(!item || !item.text || item.text.trim() === '') return;
      const itemDiv = document.createElement('div');
      itemDiv.className = item.type === 'night' ? 'answer' : ('comment' + (item.mark ? (' mark-' + item.mark) : ''));
      itemDiv.innerText = item.type === 'night' ? formatDateShort(item.text) : item.text;
      bodyDiv.appendChild(itemDiv);
    });
  });

  if(q.done){
    const doneDiv = document.createElement('div');
    doneDiv.className = 'comment';
    doneDiv.innerText = 'טופל';
    bodyDiv.appendChild(doneDiv);
  }

  if(q.autoArchived){
    const delDiv = document.createElement('div');
    delDiv.className = 'comment';
    delDiv.innerText = 'נמחק אוטומטית בסוף יום' + (dateKey ? (' (' + formatDateKeyDisplay(dateKey) + ')') : '');
    bodyDiv.appendChild(delDiv);
  } else if(q.deletedAt){
    const delDiv = document.createElement('div');
    delDiv.className = 'comment';
    delDiv.innerText = 'נמחק';
    bodyDiv.appendChild(delDiv);
  }

  qDiv.appendChild(bodyDiv);

  if(restoreInfo){
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'history-restore-btn';
    restoreBtn.innerText = '↩ שחזור';
    restoreBtn.title = 'שחזור למשימה פעילה';
    restoreBtn.onclick = () => {
      restoreQuestionFromHistory(restoreInfo.dateKey, restoreInfo.catId, restoreInfo.pushKey, q);
    };
    restoreBtn.onmouseenter = () => qDiv.classList.add('row-del-hover');
    restoreBtn.onmouseleave = () => qDiv.classList.remove('row-del-hover');
    qDiv.appendChild(restoreBtn);
  }

  return qDiv;
}

function restoreQuestionFromHistory(dateKey, catId, pushKey, q){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat){
    alert('לא ניתן לשחזר - הקטגוריה המקורית כבר לא קיימת בלוח.');
    return;
  }

  const restored = Object.assign({}, q, { id: uid('q') });
  cat.questions.push(restored);

  if(database){
    database.ref('historyState/' + dateKey + '/' + catId + '/questions/' + pushKey).remove().catch((err) => {
      console.error('Firebase HISTORY REMOVE failed:', err);
    });
  }
  if(historyData[dateKey] && historyData[dateKey][catId] && historyData[dateKey][catId].questions){
    delete historyData[dateKey][catId].questions[pushKey];
  }

  currentView = 'board';
  render();
  saveStateToFirebase();
}

function renderHistory(){
  const board = document.getElementById('board');
  board.innerHTML = '';

  if(historyLoadError){
    const errBox = document.createElement('div');
    errBox.className = 'history-error';
    errBox.innerHTML = '<b>לא ניתן לטעון את ההיסטוריה</b>' +
      'שגיאה מ-Firebase: <code>' + historyLoadError + '</code>';
    board.appendChild(errBox);
    return;
  }

  const dateKeys = Object.keys(historyData || {});
  const catsAgg = {};
  dateKeys.forEach(dateKey => {
    const catsForDate = historyData[dateKey] || {};
    Object.keys(catsForDate).forEach(catId => {
      const catEntry = catsForDate[catId];
      if(!catEntry || !catEntry.questions) return;
      if(!catsAgg[catId]) catsAgg[catId] = { title: catEntry.title || '', items: [] };
      if(catEntry.title) catsAgg[catId].title = catEntry.title;
      Object.keys(catEntry.questions).forEach(key => {
        const q = catEntry.questions[key];
        if(!q) return;
        catsAgg[catId].items.push({ dateKey: dateKey, key: key, q: q });
      });
    });
  });
  Object.keys(catsAgg).forEach(catId => {
    catsAgg[catId].items.sort((a, b) => {
      if(a.dateKey !== b.dateKey) return a.dateKey < b.dateKey ? -1 : 1;
      return a.key < b.key ? -1 : (a.key > b.key ? 1 : 0);
    });
  });

  const catOrderMap = {};
  state.categories.forEach((c, i) => { catOrderMap[c.id] = i; });
  const catIds = Object.keys(catsAgg)
    .filter(catId => catsAgg[catId].items.length > 0)
    .sort((a, b) => {
      const ao = Object.prototype.hasOwnProperty.call(catOrderMap, a) ? catOrderMap[a] : Infinity;
      const bo = Object.prototype.hasOwnProperty.call(catOrderMap, b) ? catOrderMap[b] : Infinity;
      if(ao !== bo) return ao - bo;
      return a.localeCompare(b);
    });

  if(catIds.length === 0){
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.innerText = 'עדיין אין משימות בהיסטוריה.';
    board.appendChild(empty);
    return;
  }

  catIds.forEach(catId => {
    const catEntry = catsAgg[catId];
    const isNightCat = (catId === 'cat-night');

    const catDiv = document.createElement('div');
    catDiv.className = 'category';

    const header = document.createElement('div');
    header.className = 'category-header';
    const titleEl = document.createElement('div');
    titleEl.className = 'category-title';
    titleEl.innerText = catEntry.title || '';
    header.appendChild(titleEl);
    catDiv.appendChild(header);

    let mainCounter = 0;
    catEntry.items.forEach(item => {
      const q = item.q;
      if(!q.sub) mainCounter++;
      const label = q.sub ? '+' : (mainCounter + '.');
      const restoreInfo = { dateKey: item.dateKey, catId: catId, pushKey: item.key };
      catDiv.appendChild(buildReadOnlyQuestionBlock(q, isNightCat, label, restoreInfo, item.dateKey));
    });

    board.appendChild(catDiv);
  });
}

function render(){
  const toggleBtn = document.getElementById('historyToggleBtn');
  if(toggleBtn) toggleBtn.innerText = (currentView === 'history') ? 'חזרה ללוח' : 'היסטוריה';

  const pageTitle = document.getElementById('pageTitle');
  if(pageTitle){
    pageTitle.innerText = (currentView === 'history') ? 'היסטורית משימות ומטלות' : 'משימות ומטלות';
  }
  const todayDateEl = document.getElementById('todayDate');
  if(todayDateEl){
    todayDateEl.style.display = (currentView === 'history') ? 'none' : '';
  }

  const boardEl = document.getElementById('board');
  if(boardEl){
    boardEl.classList.toggle('board-grid', currentView === 'board');
  }

  if(currentView === 'history'){
    renderHistory();
  } else {
    renderBoard();
  }
}

document.addEventListener('click', (e) => {
  if(e.target.tagName === 'IMG' && e.target.closest('[contenteditable="true"]')){
    e.preventDefault();
    openImageResizePopup(e.target);
  } else if(activeResizeImg && !e.target.closest('.image-resize-popup')){
    closeImageResizePopup();
  }

  let needsRender = false;
  if(openMarkPopup && !e.target.closest('.mark-tools')){
    openMarkPopup = null;
    needsRender = true;
  }
  if(openAddCommentPopup && !e.target.closest('.btn-add-comment') && !e.target.closest('.add-comment-popup')){
    openAddCommentPopup = null;
    needsRender = true;
  }
  if(openRowAddPopup && !e.target.closest('.btn-add-comment') && !e.target.closest('.add-comment-popup')){
    openRowAddPopup = null;
    needsRender = true;
  }
  if(openQuestionMenu && !e.target.closest('.question-menu')){
    openQuestionMenu = null;
    needsRender = true;
  }
  if(needsRender) render();
});

render();
</script>
